version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: fsd_grocery_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: fsd_grocery
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fsd_grocery_backend
    ports:
      - "4174:4174"
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB: fsd_grocery
      PORT: 4174
      NODE_ENV: production
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fsd_grocery_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://backend:4174
    restart: unless-stopped

volumes:
  mongodb_data:
  mongodb_config:
