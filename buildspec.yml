version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:=latest}

  build:
    commands:
      - echo Build started on `date`
      - echo Building the Docker images...
      - docker build -t $REPOSITORY_URI/fsd-grocery-backend:$IMAGE_TAG ./backend
      - docker build -t $REPOSITORY_URI/fsd-grocery-backend:latest ./backend
      - docker build -t $REPOSITORY_URI/fsd-grocery-frontend:$IMAGE_TAG ./frontend
      - docker build -t $REPOSITORY_URI/fsd-grocery-frontend:latest ./frontend

  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker images...
      - docker push $REPOSITORY_URI/fsd-grocery-backend:$IMAGE_TAG
      - docker push $REPOSITORY_URI/fsd-grocery-backend:latest
      - docker push $REPOSITORY_URI/fsd-grocery-frontend:$IMAGE_TAG
      - docker push $REPOSITORY_URI/fsd-grocery-frontend:latest
      - echo Writing image definitions file...
      - printf '[{"name":"fsd-grocery-backend","imageUri":"%s"},{"name":"fsd-grocery-frontend","imageUri":"%s"}]' $REPOSITORY_URI/fsd-grocery-backend:$IMAGE_TAG $REPOSITORY_URI/fsd-grocery-frontend:$IMAGE_TAG > imagedefinitions.json

artifacts:
  files: imagedefinitions.json

cache:
  paths:
    - '/root/.docker/**/*'
    - '/root/.m2/**/*'
